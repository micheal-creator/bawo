services:
  postgres:
    image: postgres:16-alpine
    container_name: bawo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bawo
      POSTGRES_PASSWORD: bawo
      POSTGRES_DB: bawo
    ports:
      - "5432:5432"
    volumes:
      - bawo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bawo -d bawo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bawo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - bawo-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bawo-postgres:
  bawo-redis:
